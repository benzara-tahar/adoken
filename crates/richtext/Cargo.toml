[package]
name = "adoken-richtext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Rich text for work item descriptions and comments (spec 0015 FR-3, FR-17, FR-18): one document model parsed from Azure DevOps HTML or Markdown, HTML ↔ Markdown conversion and the no-silent-loss gate. No IO, no gpui."

[dependencies]
# MIT. CommonMark + GFM tables, task lists and strikethrough; the same parser zeron uses.
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "parse"
harness = false
