[[variant]]
appearance = "dark"
id = "nord"
name = "Nord"

[variant.colors]
bg.app = "#292e39"
bg.sidebar = "#292e39"
bg.surface = "#2e3440"
bg.raised = "#3b4252"
bg.overlay = "#3e4556"
bg.scrim = "#00000099"
bg.input = "#2c313d"
bg.code = "#2e3440"
bg.hover = "#ffffff0f"
bg.active = "#ffffff17"
bg.selected = "#88c0d029"
bg.selected_muted = "#ffffff12"

border.subtle = "#ffffff0f"
border.default = "#ffffff1a"
border.strong = "#ffffff2e"
border.control = "#8892a4"
border.focus = "@accent.fg"

text.primary = "#d8dee9"
text.secondary = "#c4ccdb"
text.tertiary = "#b0bace"
text.disabled = "#5b6372"
text.link = "#96b7d8"
text.match = "@accent.fg"

accent.solid = "#88c0d0"
accent.solid_hover = "#98d0e0"
accent.on = "#0e0f13"
accent.fg = "#98d0e0"
accent.wash = "#88c0d01f"

status.success.fg = "#b6d19f"
status.success.wash = "#a3be8c1f"
status.warning.fg = "#ebcb8b"
status.warning.wash = "#ebcb8b1f"
status.danger.fg = "#ffa2a8"
status.danger.wash = "#bf616a1f"
status.danger.solid = "#bf616a"
status.danger.on = "#0e0f13"
status.info.fg = "#a6c7e8"
status.info.wash = "#81a1c11f"
shadow.color = "#000000"

diff.add.bg = "#a3be8c1f"
diff.add.word = "#a3be8c3d"
diff.add.gutter = "@status.success.fg"
diff.del.bg = "#bf616a1f"
diff.del.word = "#bf616a3d"
diff.del.gutter = "@status.danger.fg"
diff.hunk.bg = "#81a1c114"
diff.hunk.fg = "@text.link"
diff.comment = "@status.warning.fg"

syntax.keyword = "#a9caec"
syntax.string = "#b3ce9b"
syntax.number = "#e1bada"
syntax.constant = "@syntax.number"
syntax.comment = "#b8c7e4"
syntax.function = "#98d0e0"
syntax.type = "#a2cfce"
syntax.variable = "#d8dee9"
syntax.property = "#ffb8a2"
syntax.operator = "#a9caec"
syntax.punctuation = "#bec6d4"
syntax.tag = "#a9caec"
syntax.attribute = "#a2cfce"

pr.active = "@status.info.fg"
pr.draft = "@text.tertiary"
pr.completed = "#b48ead"
pr.abandoned = "@text.disabled"
vote.approved = "@status.success.fg"
vote.approved_suggestions = "@status.success.fg"
vote.waiting = "@status.warning.fg"
vote.rejected = "@status.danger.fg"
vote.none = "@text.tertiary"
pipeline.succeeded = "@status.success.fg"
pipeline.failed = "@status.danger.fg"
pipeline.running = "@status.info.fg"
pipeline.queued = "@text.tertiary"
pipeline.canceled = "@text.tertiary"
pipeline.partial = "@status.warning.fg"
wi.bug = "@status.danger.fg"
wi.task = "@status.warning.fg"
wi.story = "@status.info.fg"
wi.feature = "@pr.completed"
wi.epic = "#d5967b"
wi.issue = "#bb7f95"
wi.other = "@text.secondary"
priority.p1 = "@status.danger.fg"
priority.p2 = "@status.warning.fg"
priority.p3 = "@text.secondary"
priority.p4 = "@text.tertiary"

ken.primary = "#88c0d0"
ken.secondary = "#ebcb8b"
ken.outline = "#101217"
ken.spark = "#f5e5c5"
