# Built-in adoken theme. Source of truth: docs/design/tokens.md §2.
# Loaded through the same parser as user themes, in strict mode (every key
# required, no errors allowed). Copy this file to
# <config>/themes/<id>.adoken-theme.toml as a starting point for your own.
name = "adoken"
author = "adoken"

[[variant]]
appearance = "dark"
name = "Dojo Night"

[variant.colors]
bg.app = "#0E0F13"
bg.sidebar = "#111217"
bg.surface = "#15161C"
bg.raised = "#1B1D24"
bg.overlay = "#1F2129"
bg.scrim = "#05060899"
bg.input = "#101116"
bg.code = "#121318"
bg.hover = "#FFFFFF0F"
bg.active = "#FFFFFF17"
bg.selected = "#F26B3A29"
bg.selected_muted = "#FFFFFF12"

border.subtle = "#FFFFFF0F"
border.default = "#FFFFFF1A"
border.strong = "#FFFFFF2E"
border.control = "#6A6E7E"
border.focus = "#FF8A5F"

text.primary = "#ECEDF1"
text.secondary = "#A6A9B6"
text.tertiary = "#9296A6"
text.disabled = "#5A5E6C"
text.link = "#8FB4FF"
text.match = "#FF8A5F"

accent.solid = "#F26B3A"
accent.solid_hover = "#FF7B4B"
accent.on = "#1A0A04"
accent.fg = "#FF8A5F"
accent.wash = "#F26B3A1F"

status.success.fg = "#3FD18A"
status.success.wash = "#3FD18A1F"
status.warning.fg = "#F0B545"
status.warning.wash = "#F0B5451F"
status.danger.fg = "#FF5C6C"
status.danger.wash = "#FF5C6C1F"
status.danger.solid = "#D63A40"
status.danger.on = "#FFFFFF"
status.info.fg = "#62A8FF"
status.info.wash = "#62A8FF1F"
shadow.color = "#000000"

diff.add.bg = "#3FD18A1F"
diff.add.word = "#3FD18A3D"
diff.add.gutter = "@status.success.fg"
diff.del.bg = "#FF5C6C1F"
diff.del.word = "#FF5C6C3D"
diff.del.gutter = "@status.danger.fg"
diff.hunk.bg = "#62A8FF14"
diff.hunk.fg = "@text.link"
diff.comment = "@status.warning.fg"

syntax.keyword = "#FF8A5F"
syntax.string = "#9BDB8A"
syntax.number = "#FFC46B"
syntax.constant = "@syntax.number"
syntax.comment = "#A0A4B3"
syntax.function = "#8FB4FF"
syntax.type = "#6FD6D6"
syntax.variable = "#ECEDF1"
syntax.property = "#C9B6FF"
syntax.operator = "#C2C5D0"
syntax.punctuation = "#A6A9B6"
syntax.tag = "#FF8A9A"
syntax.attribute = "@syntax.number"

pr.active = "@status.info.fg"
pr.draft = "@text.tertiary"
pr.completed = "#A78BFA"
pr.abandoned = "@text.disabled"
vote.approved = "@status.success.fg"
vote.approved_suggestions = "@status.success.fg"
vote.waiting = "@status.warning.fg"
vote.rejected = "@status.danger.fg"
vote.none = "@text.tertiary"
pipeline.succeeded = "@status.success.fg"
pipeline.failed = "@status.danger.fg"
pipeline.partial = "@status.warning.fg"
pipeline.running = "@status.info.fg"
pipeline.queued = "@text.tertiary"
pipeline.canceled = "@text.tertiary"
wi.bug = "#FF6B6B"
wi.task = "@status.warning.fg"
wi.story = "@status.info.fg"
wi.feature = "@pr.completed"
wi.epic = "#FF9F43"
wi.issue = "#E879F9"
wi.other = "@text.secondary"
priority.p1 = "@status.danger.fg"
priority.p2 = "@status.warning.fg"
priority.p3 = "@text.secondary"
priority.p4 = "@text.tertiary"

ken.primary = "#FF5A2E"
ken.secondary = "#FFD23F"
ken.outline = "#1A0A04"
ken.spark = "#FFE8A3"

