name = "SynthWave '84"
author = "Robb Owen"
license = "MIT"

# Contrast adjustments (tokens.md §9.3, OKLab lightness only):
#   text.tertiary #848bbd → #9ca4d7 (was 3.45:1 on bg.selected, needs 4.5:1)
#   status.danger.fg #fe4450 → #fe6d6e (was 3.73:1 on status.danger.wash, needs 4.5:1)
#   syntax.string #f97e72 → #fdaca2 (was 3.22:1 on diff.add.word, needs 4.5:1)
#   syntax.comment #848bbd → #b8c0f5 (was 2.50:1 on diff.add.word, needs 4.5:1)
#   syntax.type #fe4450 → #feaca8 (was 2.40:1 on diff.add.word, needs 4.5:1)
#   syntax.attribute #dd5500 → #feae8f (was 2.10:1 on diff.add.word, needs 4.5:1)
[[variant]]
appearance = "dark"
id = "synthwave-84"
name = "SynthWave '84"

[variant.colors]
bg.app = "#241b2f"
bg.sidebar = "#241b2f"
bg.surface = "#262335"
bg.raised = "#2a2139"
bg.overlay = "#2e2440"
bg.scrim = "#00000099"
bg.input = "#251f32"
bg.code = "#262335"
bg.hover = "#ffffff0f"
bg.active = "#ffffff17"
bg.selected = "#ff7edb29"
bg.selected_muted = "#ffffff12"

border.subtle = "#ffffff0f"
border.default = "#ffffff1a"
border.strong = "#ffffff2e"
border.control = "#848bbd"
border.focus = "@accent.fg"

text.primary = "#ffffff"
text.secondary = "#b8b5c6"
text.tertiary = "#9ca4d7"
text.disabled = "#5a5c80"
text.link = "#03edf9"
text.match = "@accent.fg"

accent.solid = "#ff7edb"
accent.solid_hover = "#ff9fe2"
accent.on = "#0e0f13"
accent.fg = "#ff7edb"
accent.wash = "#ff7edb1f"

status.success.fg = "#72f1b8"
status.success.wash = "#72f1b81f"
status.warning.fg = "#fede5d"
status.warning.wash = "#fede5d1f"
status.danger.fg = "#fe6d6e"
status.danger.wash = "#fe44501f"
status.danger.solid = "#fe4450"
status.danger.on = "#0e0f13"
status.info.fg = "#03edf9"
status.info.wash = "#03edf91f"
shadow.color = "#000000"

diff.add.bg = "#72f1b81f"
diff.add.word = "#72f1b83d"
diff.add.gutter = "@status.success.fg"
diff.del.bg = "#fe44501f"
diff.del.word = "#fe44503d"
diff.del.gutter = "@status.danger.fg"
diff.hunk.bg = "#03edf914"
diff.hunk.fg = "@text.link"
diff.comment = "@status.warning.fg"

syntax.keyword = "#72f1b8"
syntax.string = "#fdaca2"
syntax.number = "#2ee2fa"
syntax.constant = "@syntax.number"
syntax.comment = "#b8c0f5"
syntax.function = "#72f1b8"
syntax.type = "#feaca8"
syntax.variable = "#f8f8f2"
syntax.property = "#2ee2fa"
syntax.operator = "#72f1b8"
syntax.punctuation = "#72f1b8"
syntax.tag = "#72f1b8"
syntax.attribute = "#feae8f"

pr.active = "@status.info.fg"
pr.draft = "@text.tertiary"
pr.completed = "#ff7edb"
pr.abandoned = "@text.disabled"
vote.approved = "@status.success.fg"
vote.approved_suggestions = "@status.success.fg"
vote.waiting = "@status.warning.fg"
vote.rejected = "@status.danger.fg"
vote.none = "@text.tertiary"
pipeline.succeeded = "@status.success.fg"
pipeline.failed = "@status.danger.fg"
pipeline.running = "@status.info.fg"
pipeline.queued = "@text.tertiary"
pipeline.canceled = "@text.tertiary"
pipeline.partial = "@status.warning.fg"
wi.bug = "@status.danger.fg"
wi.task = "@status.warning.fg"
wi.story = "@status.info.fg"
wi.feature = "@pr.completed"
wi.epic = "#fe9157"
wi.issue = "#ff67a3"
wi.other = "@text.secondary"
priority.p1 = "@status.danger.fg"
priority.p2 = "@status.warning.fg"
priority.p3 = "@text.secondary"
priority.p4 = "@text.tertiary"

ken.primary = "#ff7edb"
ken.secondary = "#fede5d"
ken.outline = "#0e0b13"
ken.spark = "#ffefae"
