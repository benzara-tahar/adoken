[[variant]]
appearance = "dark"
id = "atom-one-dark"
name = "Atom One Dark"

[variant.colors]
bg.app = "#21252b"
bg.sidebar = "#21252b"
bg.surface = "#282c34"
bg.raised = "#21252b"
bg.overlay = "#252930"
bg.scrim = "#00000099"
bg.input = "#252930"
bg.code = "#282c34"
bg.hover = "#ffffff0f"
bg.active = "#ffffff17"
bg.selected = "#528bff29"
bg.selected_muted = "#ffffff12"

border.subtle = "#ffffff0f"
border.default = "#ffffff1a"
border.strong = "#ffffff2e"
border.control = "#707785"
border.focus = "@accent.fg"

text.primary = "#b8bfcc"
text.secondary = "#a3abba"
text.tertiary = "#a3abb9"
text.disabled = "#454a55"
text.link = "#61afef"
text.match = "@accent.fg"

accent.solid = "#528bff"
accent.solid_hover = "#6d9efd"
accent.on = "#0e0f13"
accent.fg = "#6d9efd"
accent.wash = "#528bff1f"

status.success.fg = "#98c379"
status.success.wash = "#98c3791f"
status.warning.fg = "#d19a66"
status.warning.wash = "#d19a661f"
status.danger.fg = "#f27c84"
status.danger.wash = "#e06c751f"
status.danger.solid = "#e06c75"
status.danger.on = "#0e0f13"
status.info.fg = "#61afef"
status.info.wash = "#61afef1f"
shadow.color = "#000000"

diff.add.bg = "#98c3791f"
diff.add.word = "#98c3793d"
diff.add.gutter = "@status.success.fg"
diff.del.bg = "#e06c751f"
diff.del.word = "#e06c753d"
diff.del.gutter = "@status.danger.fg"
diff.hunk.bg = "#61afef14"
diff.hunk.fg = "@text.link"
diff.comment = "@status.warning.fg"

syntax.keyword = "#e9a3fe"
syntax.string = "#a1cd82"
syntax.number = "#ecb37f"
syntax.constant = "@syntax.number"
syntax.comment = "#b6becc"
syntax.function = "#82c5fe"
syntax.type = "#e5c07b"
syntax.variable = "#ffa5a8"
syntax.property = "#6dcdd9"
syntax.operator = "#e9a3fe"
syntax.punctuation = "#b8bfcc"
syntax.tag = "#ffa5a8"
syntax.attribute = "#82c5fe"

pr.active = "@status.info.fg"
pr.draft = "@text.tertiary"
pr.completed = "#c678dd"
pr.abandoned = "@text.disabled"
vote.approved = "@status.success.fg"
vote.approved_suggestions = "@status.success.fg"
vote.waiting = "@status.warning.fg"
vote.rejected = "@status.danger.fg"
vote.none = "@text.tertiary"
pipeline.succeeded = "@status.success.fg"
pipeline.failed = "@status.danger.fg"
pipeline.running = "@status.info.fg"
pipeline.queued = "@text.tertiary"
pipeline.canceled = "@text.tertiary"
pipeline.partial = "@status.warning.fg"
wi.bug = "@status.danger.fg"
wi.task = "@status.warning.fg"
wi.story = "@status.info.fg"
wi.feature = "@pr.completed"
wi.epic = "#d9836e"
wi.issue = "#d073b3"
wi.other = "@text.secondary"
priority.p1 = "@status.danger.fg"
priority.p2 = "@status.warning.fg"
priority.p3 = "@text.secondary"
priority.p4 = "@text.tertiary"

ken.primary = "#528bff"
ken.secondary = "#d19a66"
ken.outline = "#0d0f11"
ken.spark = "#e8cdb3"
