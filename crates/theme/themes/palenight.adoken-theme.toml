[[variant]]
appearance = "dark"
id = "palenight"
name = "Palenight"

[variant.colors]
bg.app = "#232635"
bg.sidebar = "#232635"
bg.surface = "#292d3e"
bg.raised = "#292d3e"
bg.overlay = "#2d3143"
bg.scrim = "#00000099"
bg.input = "#262a3a"
bg.code = "#292d3e"
bg.hover = "#ffffff0f"
bg.active = "#ffffff17"
bg.selected = "#82aaff29"
bg.selected_muted = "#ffffff12"

border.subtle = "#ffffff0f"
border.default = "#ffffff1a"
border.strong = "#ffffff2e"
border.control = "#7279a1"
border.focus = "@accent.fg"

text.primary = "#eeffff"
text.secondary = "#acb2d4"
text.tertiary = "#a5add8"
text.disabled = "#4c5270"
text.link = "#82aaff"
text.match = "@accent.fg"

accent.solid = "#82aaff"
accent.solid_hover = "#9bbbfe"
accent.on = "#0e0f13"
accent.fg = "#88aefe"
accent.wash = "#82aaff1f"

status.success.fg = "#c3e88d"
status.success.wash = "#c3e88d1f"
status.warning.fg = "#ffcb6b"
status.warning.wash = "#ffcb6b1f"
status.danger.fg = "#fe818f"
status.danger.wash = "#ff55721f"
status.danger.solid = "#ff5572"
status.danger.on = "#0e0f13"
status.info.fg = "#88aefe"
status.info.wash = "#82aaff1f"
shadow.color = "#000000"

diff.add.bg = "#c3e88d1f"
diff.add.word = "#c3e88d3d"
diff.add.gutter = "@status.success.fg"
diff.del.bg = "#ff55721f"
diff.del.word = "#ff55723d"
diff.del.gutter = "@status.danger.fg"
diff.hunk.bg = "#82aaff14"
diff.hunk.fg = "@text.link"
diff.comment = "@status.warning.fg"

syntax.keyword = "#e5c1ff"
syntax.string = "#c3e88d"
syntax.number = "#fec0ad"
syntax.constant = "@syntax.number"
syntax.comment = "#c4cdf9"
syntax.function = "#ffcb6b"
syntax.type = "#eeffff"
syntax.variable = "#c5cddc"
syntax.property = "#89ddff"
syntax.operator = "#e5c1ff"
syntax.punctuation = "#b8cffe"
syntax.tag = "#89ddff"
syntax.attribute = "#c1ccff"

pr.active = "@status.info.fg"
pr.draft = "@text.tertiary"
pr.completed = "#c792ea"
pr.abandoned = "@text.disabled"
vote.approved = "@status.success.fg"
vote.approved_suggestions = "@status.success.fg"
vote.waiting = "@status.warning.fg"
vote.rejected = "@status.danger.fg"
vote.none = "@text.tertiary"
pipeline.succeeded = "@status.success.fg"
pipeline.failed = "@status.danger.fg"
pipeline.running = "@status.info.fg"
pipeline.queued = "@text.tertiary"
pipeline.canceled = "@text.tertiary"
pipeline.partial = "@status.warning.fg"
wi.bug = "@status.danger.fg"
wi.task = "@status.warning.fg"
wi.story = "@status.info.fg"
wi.feature = "@pr.completed"
wi.epic = "#ff906f"
wi.issue = "#dd7aba"
wi.other = "@text.secondary"
priority.p1 = "@status.danger.fg"
priority.p2 = "@status.warning.fg"
priority.p3 = "@text.secondary"
priority.p4 = "@text.tertiary"

ken.primary = "#82aaff"
ken.secondary = "#ffcb6b"
ken.outline = "#0e0f15"
ken.spark = "#ffe5b5"
