#   status.info.fg #82aaff → #88aefe (was 4.47:1 on status.info.wash, needs 4.5:1)
#   syntax.keyword #c792ea → #e5c1ff (was 3.00:1 on diff.add.word, needs 4.5:1)
#   syntax.number #f78c6c → #fec0ad (was 3.07:1 on diff.add.word, needs 4.5:1)
