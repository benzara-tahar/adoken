# Built-in "Arcade": the high-contrast built-in (0007 FR-2). Neon cabinet
# glow on near-black: text ramp at WCAG AAA (7:1) on every surface, yellow
# focus ring, hot-pink accent. Source of truth: docs/design/tokens.md §2.10.
# Loaded in strict mode like the other built-ins (every key required).
name = "Arcade"
author = "adoken"

[[variant]]
appearance = "dark"
name = "Arcade"

[variant.colors]
bg.app = "#07060B"
bg.sidebar = "#0A0910"
bg.surface = "#0D0C14"
bg.raised = "#14121D"
bg.overlay = "#181624"
bg.scrim = "#000000B3"
bg.input = "#09080E"
bg.code = "#0B0A11"
bg.hover = "#FFFFFF14"
bg.active = "#FFFFFF24"
bg.selected = "#FF2E8833"
bg.selected_muted = "#FFFFFF1A"

border.subtle = "#FFFFFF1F"
border.default = "#FFFFFF33"
border.strong = "#FFFFFF59"
border.control = "#8C88A8"
border.focus = "#FFE14D"

text.primary = "#FFFFFF"
text.secondary = "#D9D6EA"
text.tertiary = "#BDB9D3"
text.disabled = "#6E6A85"
text.link = "#6EE7FF"
text.match = "#FFE14D"

accent.solid = "#FF2E88"
accent.solid_hover = "#FF4F9D"
accent.on = "#0A0006"
accent.fg = "#FF78B6"
accent.wash = "#FF2E8826"

status.success.fg = "#4DFF9A"
status.success.wash = "#4DFF9A26"
status.warning.fg = "#FFD23F"
status.warning.wash = "#FFD23F26"
status.danger.fg = "#FF6B85"
status.danger.wash = "#FF6B8526"
status.danger.solid = "#E0204A"
status.danger.on = "#FFFFFF"
status.info.fg = "#5CC8FF"
status.info.wash = "#5CC8FF26"
shadow.color = "#000000"

diff.add.bg = "#4DFF9A1F"
diff.add.word = "#4DFF9A40"
diff.add.gutter = "@status.success.fg"
diff.del.bg = "#FF6B851F"
diff.del.word = "#FF6B8540"
diff.del.gutter = "@status.danger.fg"
diff.hunk.bg = "#5CC8FF1A"
diff.hunk.fg = "@text.link"
diff.comment = "@status.warning.fg"

syntax.keyword = "#FF8FC4"
syntax.string = "#B8FF6E"
syntax.number = "#FFD23F"
syntax.constant = "@syntax.number"
syntax.comment = "#B4B0CA"
syntax.function = "#6EE7FF"
syntax.type = "#7CFFE0"
syntax.variable = "#FFFFFF"
syntax.property = "#D6B3FF"
syntax.operator = "#E6E3F5"
syntax.punctuation = "#C8C5DA"
syntax.tag = "#FF9A7A"
syntax.attribute = "@syntax.number"

pr.active = "@status.info.fg"
pr.draft = "@text.tertiary"
pr.completed = "#C49BFF"
pr.abandoned = "@text.disabled"
vote.approved = "@status.success.fg"
vote.approved_suggestions = "@status.success.fg"
vote.waiting = "@status.warning.fg"
vote.rejected = "@status.danger.fg"
vote.none = "@text.tertiary"
pipeline.succeeded = "@status.success.fg"
pipeline.failed = "@status.danger.fg"
pipeline.partial = "@status.warning.fg"
pipeline.running = "@status.info.fg"
pipeline.queued = "@text.tertiary"
pipeline.canceled = "@text.tertiary"
wi.bug = "#FF6B6B"
wi.task = "@status.warning.fg"
wi.story = "@status.info.fg"
wi.feature = "@pr.completed"
wi.epic = "#FFA24D"
wi.issue = "#F08CFF"
wi.other = "@text.secondary"
priority.p1 = "@status.danger.fg"
priority.p2 = "@status.warning.fg"
priority.p3 = "@text.secondary"
priority.p4 = "@text.tertiary"

ken.primary = "#FF2E88"
ken.secondary = "#FFE14D"
ken.outline = "#0A0006"
ken.spark = "#FFF3A8"
