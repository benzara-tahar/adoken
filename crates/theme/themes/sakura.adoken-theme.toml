# Built-in "Sakura": a soft light theme. Warm blossom paper, plum ink,
# cherry accent. Source of truth: docs/design/tokens.md §2.10.
# Loaded in strict mode like the other built-ins (every key required).
name = "Sakura"
author = "adoken"

[[variant]]
appearance = "light"
name = "Sakura"

[variant.colors]
bg.app = "#FBF6F7"
bg.sidebar = "#F5ECEF"
bg.surface = "#FFFFFF"
bg.raised = "#FFFFFF"
bg.overlay = "#FFFFFF"
bg.scrim = "#2A1A2052"
bg.input = "#FFFFFF"
bg.code = "#FDF9FA"
bg.hover = "#3A1F2A0A"
bg.active = "#3A1F2A14"
bg.selected = "#D6336C1A"
bg.selected_muted = "#3A1F2A0F"

border.subtle = "#3A1F2A12"
border.default = "#3A1F2A21"
border.strong = "#3A1F2A38"
border.control = "#8A7780"
border.focus = "#B8235A"

text.primary = "#2A1A20"
text.secondary = "#5E4A53"
text.tertiary = "#6B5760"
text.disabled = "#B3A3AA"
text.link = "#2F5FB8"
text.match = "#A81E52"

accent.solid = "#B8235A"
accent.solid_hover = "#A11D4E"
accent.on = "#FFFFFF"
accent.fg = "#A81E52"
accent.wash = "#D6336C14"

status.success.fg = "#1D7A4C"
status.success.wash = "#1D7A4C14"
status.warning.fg = "#8A5A08"
status.warning.wash = "#8A5A0814"
status.danger.fg = "#C0283F"
status.danger.wash = "#C0283F14"
status.danger.solid = "#C0283F"
status.danger.on = "#FFFFFF"
status.info.fg = "#2562B8"
status.info.wash = "#2562B814"
shadow.color = "#2A1A20"

diff.add.bg = "#1D7A4C1A"
diff.add.word = "#1D7A4C26"
diff.add.gutter = "@status.success.fg"
diff.del.bg = "#C0283F1A"
diff.del.word = "#C0283F26"
diff.del.gutter = "@status.danger.fg"
diff.hunk.bg = "#2562B80F"
diff.hunk.fg = "@text.link"
diff.comment = "@status.warning.fg"

syntax.keyword = "#A3245A"
syntax.string = "#3B6B1E"
syntax.number = "#8A4B00"
syntax.constant = "@syntax.number"
syntax.comment = "#6B5760"
syntax.function = "#2A58B0"
syntax.type = "#0E6468"
syntax.variable = "#2A1A20"
syntax.property = "#6A3FB8"
syntax.operator = "#4A3A42"
syntax.punctuation = "#5E4A53"
syntax.tag = "#B02A3A"
syntax.attribute = "@syntax.number"

pr.active = "@status.info.fg"
pr.draft = "@text.tertiary"
pr.completed = "#7045C4"
pr.abandoned = "@text.disabled"
vote.approved = "@status.success.fg"
vote.approved_suggestions = "@status.success.fg"
vote.waiting = "@status.warning.fg"
vote.rejected = "@status.danger.fg"
vote.none = "@text.tertiary"
pipeline.succeeded = "@status.success.fg"
pipeline.failed = "@status.danger.fg"
pipeline.partial = "@status.warning.fg"
pipeline.running = "@status.info.fg"
pipeline.queued = "@text.tertiary"
pipeline.canceled = "@text.tertiary"
wi.bug = "#BE2F3F"
wi.task = "@status.warning.fg"
wi.story = "@status.info.fg"
wi.feature = "@pr.completed"
wi.epic = "#A65200"
wi.issue = "#A0268F"
wi.other = "@text.secondary"
priority.p1 = "@status.danger.fg"
priority.p2 = "@status.warning.fg"
priority.p3 = "@text.secondary"
priority.p4 = "@text.tertiary"

ken.primary = "#D13A6E"
ken.secondary = "#A87400"
ken.outline = "#2A0A16"
ken.spark = "#FF9EBB"
