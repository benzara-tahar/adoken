[[variant]]
appearance = "dark"
id = "cobalt2"
name = "Cobalt2"

[variant.colors]
bg.app = "#15232d"
bg.sidebar = "#15232d"
bg.surface = "#193549"
bg.raised = "#122738"
bg.overlay = "#173145"
bg.scrim = "#00000099"
bg.input = "#172c3b"
bg.code = "#193549"
bg.hover = "#ffffff0f"
bg.active = "#ffffff17"
bg.selected = "#ffc60029"
bg.selected_muted = "#ffffff12"

border.subtle = "#ffffff0f"
border.default = "#ffffff1a"
border.strong = "#ffffff2e"
border.control = "#7da1b5"
border.focus = "@accent.fg"

text.primary = "#ffffff"
text.secondary = "#b7c9d3"
text.tertiary = "#98bdd2"
text.disabled = "#507084"
text.link = "#4c9efd"
text.match = "@accent.fg"

accent.solid = "#ffc600"
accent.solid_hover = "#ffdb86"
accent.on = "#0e0f13"
accent.fg = "#ffc600"
accent.wash = "#ffc6001f"

status.success.fg = "#3ad900"
status.success.wash = "#3ad9001f"
status.warning.fg = "#ffc600"
status.warning.wash = "#ffc6001f"
status.danger.fg = "#ff7e9c"
status.danger.wash = "#ff628c1f"
status.danger.solid = "#ff628c"
status.danger.on = "#0e0f13"
status.info.fg = "#66abff"
status.info.wash = "#0088ff1f"
shadow.color = "#000000"

diff.add.bg = "#3ad9001f"
diff.add.word = "#3ad9003d"
diff.add.gutter = "@status.success.fg"
diff.del.bg = "#ff628c1f"
diff.del.word = "#ff628c3d"
diff.del.gutter = "@status.danger.fg"
diff.hunk.bg = "#0088ff14"
diff.hunk.fg = "@text.link"
diff.comment = "@status.warning.fg"

syntax.keyword = "#ffb667"
syntax.string = "#ffee80"
syntax.number = "#ffc600"
syntax.constant = "@syntax.number"
syntax.comment = "#9dc8fe"
syntax.function = "#ffc600"
syntax.type = "#feaed3"
syntax.variable = "#ffffff"
syntax.property = "#9effff"
syntax.operator = "#ffb667"
syntax.punctuation = "#ffee80"
syntax.tag = "#ffc600"
syntax.attribute = "#feb964"

pr.active = "@status.info.fg"
pr.draft = "@text.tertiary"
pr.completed = "#fb94ff"
pr.abandoned = "@text.disabled"
vote.approved = "@status.success.fg"
vote.approved_suggestions = "@status.success.fg"
vote.waiting = "@status.warning.fg"
vote.rejected = "@status.danger.fg"
vote.none = "@text.tertiary"
pipeline.succeeded = "@status.success.fg"
pipeline.failed = "@status.danger.fg"
pipeline.running = "@status.info.fg"
pipeline.queued = "@text.tertiary"
pipeline.canceled = "@text.tertiary"
pipeline.partial = "@status.warning.fg"
wi.bug = "@status.danger.fg"
wi.task = "@status.warning.fg"
wi.story = "@status.info.fg"
wi.feature = "@pr.completed"
wi.epic = "#ff9446"
wi.issue = "#fd80d1"
wi.other = "@text.secondary"
priority.p1 = "@status.danger.fg"
priority.p2 = "@status.warning.fg"
priority.p3 = "@text.secondary"
priority.p4 = "@text.tertiary"

ken.primary = "#ffc600"
ken.secondary = "#ffc600"
ken.outline = "#080e12"
ken.spark = "#ffe380"
